name: DevOps Log Investigator CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/devops-log-investigator
    paths:
      - 'projects/devops-log-investigator/**'
      - '.github/workflows/devops-log-investigator-ci.yml'
  pull_request:
    paths:
      - 'projects/devops-log-investigator/**'
      - '.github/workflows/devops-log-investigator-ci.yml'

jobs:
  guard-tests:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: projects/devops-log-investigator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Python test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install pytest pyyaml

      - name: Run policy guard tests
        env:
          PYTHONPATH: investigator
        run: .venv/bin/pytest investigator/tests/test_policy.py -q
